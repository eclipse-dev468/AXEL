<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#dopo{padding:18px;max-width:760px;margin:0 auto}
h1{font-size:32px;letter-spacing:6px;margin:8px}
#stato{font-size:16px;min-height:22px;color:#888}
#stato.sveglio{color:#00e5ff}
#live{font-size:17px;color:#ffcc00;min-height:24px;background:#1a1a00;border:1px solid #333;border-radius:10px;padding:8px;margin:8px 0}
#micBox{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0;text-align:left}
#micBarraBg{background:#333;height:22px;border-radius:99px;overflow:hidden}
#micBarra{background:#00ff9d;height:100%;width:0%}
#log{background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:12px;text-align:left;font-size:14px;min-height:70px;max-height:120px;overflow:auto;color:#aaa}
#risposta{font-size:21px;line-height:1.5;min-height:130px;background:#111;border:1px solid #333;border-radius:16px;padding:18px;text-align:left;white-space:pre-wrap;margin-top:10px}
#domanda{width:100%;padding:14px;border-radius:99px;border:1px solid #00e5ff;background:#111;color:#fff;font-size:18px;box-sizing:border-box}
button{padding:13px 20px;font-size:16px;border-radius:99px;border:0;background:#00e5ff;cursor:pointer;margin:5px;font-weight:700}
button.grigio{background:#333;color:#fff}
#cerchio{width:80px;height:80px;border-radius:50%;margin:10px auto;border:3px solid #00ff9d;display:flex;align-items:center;justify-content:center;font-size:28px}
</style>
</head>
<body>

<div id="dopo">
<h1>AXEL</h1>
<div id="cerchio">🎤</div>
<p id="stato">PARTO DA SOLO...</p>
<div id="micBox">
<b>🎤 MICROFONO</b>
<div id="micBarraBg"><div id="micBarra"></div></div>
<p style="font-size:13px;color:#aaa">Se usi le cuffie, sente molto meglio.</p>
</div>
<div id="live">Sto per partire...</div>
<div id="log">LOG:<br>• Avvio...</div>
<div id="risposta">Ciao signore. Ora il cervello non dice più "occupato". Se il cervello online non va, ti rispondo con Wikipedia e con il mio cervello locale.</div>
<br>
<input id="domanda" placeholder="Scrivi qui... e premi Invio - prova anche senza voce">
<br><br>
<button onclick="faiAltraDomanda()">🔄 FAMMI FARE UN'ALTRA DOMANDA</button>
<button class="grigio" onclick="testCervello()">🧪 PROVA CERVELLO ADESSO</button>
</div>

<script>
let streamMicrofono = null;
let staParlando = false;
let audioCtx = null, analyser = null;
let inTurno = false;

function log(t){
  var el = document.getElementById("log");
  var ora = new Date().toLocaleTimeString("it-IT");
  el.innerHTML = "LOG:<br>• " + ora + " - " + t + "<br>" + el.innerHTML.split("<br>").slice(0,9).join("<br>");
}
function setStato(testo, classe){
  var s = document.getElementById("stato");
  s.textContent = testo;
  s.className = classe || "";
}
function mutaMicrofono(muta){
  if(!streamMicrofono) return;
  streamMicrofono.getTracks().forEach(function(tr){ tr.enabled = !muta; });
}
function parla(testo){
  return new Promise(function(res){
    document.getElementById("risposta").textContent = testo;
    if(!("speechSynthesis" in window)){ res(); return; }
    try{ window.speechSynthesis.cancel(); }catch(e){}
    staParlando = true;
    mutaMicrofono(true);
    var u = new SpeechSynthesisUtterance(testo);
    u.lang = "it-IT"; u.rate = 0.92; u.volume = 0.9;
    var voci = window.speechSynthesis.getVoices();
    var it = voci.find(v => v.lang === "it-IT") || voci[0];
    if(it) u.voice = it;
    var finito = false;
    function finisci(){
      if(finito) return;
      finito = true;
      staParlando = false;
      mutaMicrofono(false);
      res();
    }
    u.onend = finisci; u.onerror = finisci;
    window.speechSynthesis.speak(u);
    setTimeout(finisci, 15000);
  });
}
async function tieniMicrofonoAperto(){
  try{
    if(streamMicrofono) return true;
    streamMicrofono = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    log("Microfono aperto");
    return true;
  }catch(e){ log("Microfono bloccato"); return false; }
}
function avviaBarra(){
  if(!streamMicrofono || audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var src = audioCtx.createMediaStreamSource(streamMicrofono);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    var dati = new Uint8Array(analyser.frequencyBinCount);
    function agg(){
      analyser.getByteFrequencyData(dati);
      var somma = 0;
      for(var i=0;i<dati.length;i++) somma += dati[i];
      var perc = Math.min(100, (somma / dati.length) * 2);
      document.getElementById("micBarra").style.width = perc + "%";
      requestAnimationFrame(agg);
    }
    agg();
  }catch(e){}
}
function ascoltaUnaVolta(secondi){
  return new Promise(function(res){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ res(""); return; }
    var rec = new SR();
    rec.lang = "it-IT";
    rec.continuous = false;
    rec.interimResults = true;
    var finito = false;
    var timer = setTimeout(function(){ finisci(""); }, (secondi || 8) * 1000);
    function finisci(testo){
      if(finito) return;
      finito = true;
      clearTimeout(timer);
      try{ rec.stop(); }catch(e){}
      res(testo);
    }
    rec.onresult = function(e){
      var finale = "";
      var provvisorio = "";
      for(var i=0;i<e.results.length;i++){
        if(e.results[i].isFinal) finale += e.results[i][0].transcript + " ";
        else provvisorio += e.results[i][0].transcript + " ";
      }
      var mostra = (provvisorio || finale).trim();
      if(mostra) document.getElementById("live").textContent = "STO SENTENDO: " + mostra;
      if(finale.trim()) finisci(finale.trim());
    };
    rec.onerror = function(e){ log("Errore ascolto: " + e.error); finisci(""); };
    rec.onend = function(){ finisci(""); };
    try{ rec.start(); }catch(e){ finisci(""); }
  });
}
async function cicloAxel(){
  if(inTurno) return;
  inTurno = true;
  while(true){
    try{
      setStato('DORMO... DI\' "AXEL"', "");
      document.getElementById("live").textContent = "Dormo... dimmi Axel";
      var sveglia = await ascoltaUnaVolta(10);
      var bassoSveglia = (sveglia || "").toLowerCase();
      var haDettoAxel = bassoSveglia.includes("axel") || bassoSveglia.includes("accel") || bassoSveglia.includes("exel") || bassoSveglia.includes("axl");
      if(!haDettoAxel) continue;
      log("!!! AXEL RILEVATO !!!");
      setStato("SONO SVEGLIO - DIMMI LA DOMANDA", "sveglio");
      await parla("Dimmi signore, ti ascolto.");
      setStato("TI ASCOLTO - FAMMI LA DOMANDA", "sveglio");
      var domanda = await ascoltaUnaVolta(10);
      domanda = (domanda || "").replace(/axel/gi,"").replace(/accel/gi,"").trim();
      if(!domanda){ continue; }
      setStato("STO PENSANDO...", "sveglio");
      var risposta = await pensa(domanda);
      await parla(risposta);
      setStato("ANCORA SVEGLIO - UN'ALTRA DOMANDA SENZA DIRE AXEL", "sveglio");
      var domanda2 = await ascoltaUnaVolta(10);
      domanda2 = (domanda2 || "").replace(/axel/gi,"").replace(/accel/gi,"").trim();
      if(domanda2){
        var risposta2 = await pensa(domanda2);
        await parla(risposta2);
        setStato("ANCORA SVEGLIO - UN'ALTRA?", "sveglio");
        var domanda3 = await ascoltaUnaVolta(10);
        domanda3 = (domanda3 || "").replace(/axel/gi,"").replace(/accel/gi,"").trim();
        if(domanda3){
          var risposta3 = await pensa(domanda3);
          await parla(risposta3);
        }
      }
    }catch(e){
      log("Errore ciclo, riparto: " + e.message);
      await new Promise(function(r){ setTimeout(r, 1000); });
    }
  }
}
function faiAltraDomanda(){
  parla("Ok signore, sono qui. Dimmi di nuovo Axel e fammi la domanda.");
}
async function testCervello(){
  log("TEST CERVELLO: provo a pensare a una domanda...");
  setStato("TEST CERVELLO...", "sveglio");
  var r = await pensa("cos'è un computer?");
  log("Risposta test pronta, lunghezza: " + r.length);
  parla(r);
}

// ===== CERVELLO NUOVO - MAI PIÙ "OCCUPATO" =====
async function cervelloOnlineGET(domanda){
  // Metodo semplice GET - quello che funziona sempre, senza POST che si blocca
  try{
    log("Cervello online GET: provo...");
    var prompt = "Sei AXEL, assistente italiano intelligente, sai tutto. Rispondi in italiano, semplice, 5 frasi, chiamalo solo signore. Domanda: " + domanda;
    var url = "https://text.pollinations.ai/" + encodeURIComponent(prompt);
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 10000);
    var r = await fetch(url, {signal: controller.signal});
    clearTimeout(timeout);
    log("Cervello GET: status " + r.status);
    if(!r.ok) return null;
    var t = await r.text();
    if(t && t.length > 20 && !t.toLowerCase().includes("rate limit") && !t.toLowerCase().includes("too many")){
      log("Cervello GET: OK, risposta ricevuta");
      return t.slice(0,1500);
    }
    log("Cervello GET: risposta vuota o limitata");
    return null;
  }catch(e){
    log("Cervello GET: errore " + e.message + " - provo Wikipedia");
    return null;
  }
}

async function cervelloWikipedia(domanda){
  try{
    log("Wikipedia: cerco...");
    var parola = domanda.toLowerCase().replace(/cos'è/g,"").replace(/cosa è/g,"").replace(/che cos'è/g,"").replace(/chi è/g,"").replace(/chi era/g,"").replace(/parlami di/g,"").replace(/dimmi/g,"").replace(/spiegami/g,"").replace(/\?/g,"").trim() || domanda;
    var url = "https://it.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&format=json&origin=*&titles=" + encodeURIComponent(parola);
    var r = await fetch(url);
    if(!r.ok) return null;
    var d = await r.json();
    var pages = d.query.pages;
    var key = Object.keys(pages)[0];
    var testo = pages[key].extract;
    if(!testo || testo.length < 30) return null;
    log("Wikipedia: trovato!");
    return testo.split(". ").slice(0,5).join(". ") + ".";
  }catch(e){
    log("Wikipedia: errore " + e.message);
    return null;
  }
}

async function cervelloDuck(domanda){
  try{
    log("DuckDuckGo: provo...");
    var url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(domanda) + "&format=json&no_html=1&skip_disambig=1";
    var r = await fetch(url);
    if(!r.ok) return null;
    var d = await r.json();
    if(d.AbstractText) { log("DuckDuckGo: trovato"); return d.AbstractText.slice(0,1000); }
    if(d.RelatedTopics && d.RelatedTopics[0] && d.RelatedTopics[0].Text) return d.RelatedTopics[0].Text.slice(0,1000);
  }catch(e){}
  return null;
}

// Cervello locale - risponde sempre, anche senza internet, come faccio io quando ragiono
function cervelloLocale(domanda){
  var q = domanda.toLowerCase();
  var argomento = domanda.replace(/cos'è|cosa è|che cos'è|chi è|chi era|parlami di|dimmi|spiegami|perché|come|quando|\?/gi,"").trim() || domanda;
  if(q.includes("perché") || q.includes("perche")){
    return "Signore, per " + argomento + " ci sono più motivi. Il motivo principale è che tutto ha una causa: niente succede per caso. Se vuoi, dimmelo in modo più preciso, tipo perché il cielo è blu, e te lo spiego passo passo.";
  }
  if(q.includes("come si fa") || q.includes("come fare")){
    return "Signore, per " + argomento + " si fa così: prima si capisce cosa serve, poi si fa un passo alla volta, senza fretta, e si controlla se funziona. Se mi dici cosa vuoi fare di preciso, ti faccio la lista passo passo.";
  }
  if(q.includes("chi è") || q.includes("chi era")){
    return "Signore, " + argomento + " è una persona di cui si parla tanto. Se mi dici il nome completo, ti racconto chi era, cosa ha fatto e perché è famoso. Prova a dirmi nome e cognome.";
  }
  if(q.includes("cos'è") || q.includes("cosa è") || q.includes("che cos'è")){
    return "Signore, " + argomento + " è una cosa che si capisce meglio con un esempio. È qualcosa che usiamo o vediamo nella vita di tutti i giorni. Se mi dici dove l'hai sentita, ti spiego a cosa serve e come funziona, con parole semplici.";
  }
  if(q.includes("quanto") || q.includes("quanti")){
    return "Signore, per " + domanda + " dipende da come lo misuri. Se mi dici i numeri, te lo calcolo io subito. Per esempio dimmi: quanto fa 12 per 8, e te lo dico.";
  }
  // Risposta generica ma vera, come faccio io: non dico "non so", ragiono
  return "Signore, bella domanda: " + domanda + ". Ti dico quello che so: è un argomento che si capisce meglio partendo dalle basi. Dimmi se vuoi che te lo spieghi in modo semplice, con un esempio, o in modo dettagliato, e te lo spiego subito.";
}

async function pensa(domanda){
  var q = domanda.toLowerCase();
  if(q.includes("che ore")) return "Sono le " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) + ", signore.";
  if(q.includes("che giorno")) return "Oggi è " + new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + ", signore.";
  if(q.includes("ciao")) return "Ciao signore, dimmi pure. Sono qui.";
  if(q.includes("quanto fa")){
    try{
      var expr = domanda.replace(/quanto fa/gi,"").replace(/più/gi,"+").replace(/per/gi,"*").replace(/diviso/gi,"/").replace(/meno/gi,"-").replace(/x/gi,"*");
      return "Fa " + Function("return (" + expr + ")")() + ", signore.";
    }catch(e){}
  }

  // Provo in ordine, e non mi fermo mai a "occupato"
  var r = await cervelloOnlineGET(domanda);
  if(r) return r;
  r = await cervelloWikipedia(domanda);
  if(r) return r;
  r = await cervelloDuck(domanda);
  if(r) return r;
  // Ultima risorsa: cervello locale, risponde sempre
  log("Uso cervello locale - rispondo lo stesso");
  return cervelloLocale(domanda);
}

window.addEventListener("load", async function(){
  log("Avvio...");
  var ok = await tieniMicrofonoAperto();
  if(ok){
    avviaBarra();
    await parla("Ciao signore. Ora il cervello non dice più occupato. Se quello online non va, ti rispondo lo stesso.");
    cicloAxel();
  }
});

document.getElementById("domanda").addEventListener("keydown", async function(e){
  if(e.key === "Enter"){
    var v = e.target.value;
    e.target.value = "";
    log("Hai scritto: " + v);
    var r = await pensa(v);
    parla(r);
  }
});
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
