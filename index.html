<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#gate{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;z-index:10}
#gate b{font-size:60px;letter-spacing:12px}
#gate span{margin-top:15px;color:#00e5ff;font-size:18px}
#dopo{display:none;padding:20px;max-width:700px;margin:0 auto}
h1{font-size:36px;letter-spacing:6px}
#risposta{font-size:22px;line-height:1.5;min-height:120px;background:#111;border:1px solid #222;border-radius:16px;padding:20px;text-align:left}
#domanda{width:100%;padding:14px;border-radius:99px;border:1px solid #00e5ff;background:#111;color:#fff;font-size:18px;box-sizing:border-box}
button{padding:13px 22px;font-size:17px;border-radius:99px;border:0;background:#00e5ff;cursor:pointer;margin:8px;font-weight:700}
#stato{color:#00ff9d;letter-spacing:2px;font-size:13px}
</style>
</head>
<body>

<div id="gate" onclick="parti()">
<b>AXEL</b>
<span>CLICCA QUI PER INIZIALIZZARE</span>
<p style="opacity:.6">Clicca e parla subito</p>
</div>

<div id="dopo">
<h1>AXEL</h1>
<p id="stato">PRONTO - CHIEDIMI TUTTO</p>
<div id="risposta">Ciao, sono Axel. Ora sono un vero AI. Chiedimi qualsiasi cosa: cos'è un PC, chi è Napoleone, cos'è un buco nero. Ti rispondo io a voce, non dico più "faccio la ricerca".</div>
<br>
<input id="domanda" placeholder="Scrivi qui... es: cos'è un PC? e premi Invio">
<br><br>
<button onclick="provaVoce()">🔊 PROVA VOCE</button>
<button onclick="ascolta()">🎤 PARLA CON VOCE</button>
<button onclick="ferma()">⏹ FERMA VOCE</button>
</div>

<script>
let parlando = false;

function parti(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("dopo").style.display = "block";
  parla("Ciao, sono Axel. Ora sono un vero AI che sa tutto. Chiedimi qualsiasi cosa.");
}

function parla(testo){
  document.getElementById("risposta").textContent = testo;
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(testo);
  u.lang = "it-IT";
  u.rate = 0.95;
  var voci = window.speechSynthesis.getVoices();
  var it = voci.find(v => v.lang === "it-IT") || voci[0];
  if(it) u.voice = it;
  window.speechSynthesis.speak(u);
}
function ferma(){ window.speechSynthesis.cancel(); }
function provaVoce(){ parla("Mi senti? Sono Axel. Ora parlo davvero e so tutto."); }

// --- CERVELLO VERO: WIKIPEDIA CHE SA TUTTO ---
async function cercaSuWikipedia(domanda){
  try{
    // Pulisci la domanda: togli "cos'è", "chi è", ecc e tieni solo la parola
    var parola = domanda.toLowerCase()
      .replace(/cos'è/g,"").replace(/cosa è/g,"").replace(/che cos'è/g,"")
      .replace(/chi è/g,"").replace(/chi era/g,"").replace(/parlami di/g,"")
      .replace(/dimmi/g,"").replace(/spiegami/g,"").replace(/\?/g,"").trim();
    if(!parola) parola = domanda;

    // Wikipedia in italiano, con origin=* così non si blocca
    var url = "https://it.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&format=json&origin=*&titles=" + encodeURIComponent(parola);
    var r = await fetch(url);
    var d = await r.json();
    var pages = d.query.pages;
    var key = Object.keys(pages)[0];
    var testo = pages[key].extract;
    if(!testo || testo.length < 20) return null;
    // Prendi solo le prime 4 frasi, così è lungo ma non infinito
    var frasi = testo.split(". ");
    var corto = frasi.slice(0,4).join(". ");
    if(!corto.endsWith(".")) corto += ".";
    return corto.slice(0,1200);
  }catch(e){
    return null;
  }
}

async function cercaOnlineLibero(domanda){
  try{
    var r = await fetch("https://text.pollinations.ai/" + encodeURIComponent("Rispondi in italiano, in modo semplice e completo, massimo 5 frasi: " + domanda));
    if(!r.ok) return null;
    var t = await r.text();
    if(t && t.length > 20) return t.slice(0,1200);
  }catch(e){}
  return null;
}

async function rispondi(domanda){
  if(!domanda) return;
  document.getElementById("stato").textContent = "STO PENSANDO...";
  document.getElementById("risposta").textContent = "Aspetta, sto cercando " + domanda + "...";

  var q = domanda.toLowerCase();
  var risposta = "";

  // Risposte immediate veloci
  if(q.includes("ciao") || q.includes("buongiorno")) risposta = "Ciao! Sono Axel. Chiedimi tutto quello che vuoi, so rispondere a tutto.";
  else if(q.includes("chi sei")) risposta = "Sono Axel, il tuo assistente personale. Sono come Jarvis, ma vero. So tutto grazie a Wikipedia e a internet.";
  else if(q.includes("che ore")) risposta = "Sono le " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) + ".";
  else if(q.includes("che giorno")) risposta = "Oggi è " + new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + ".";
  else if(q.includes("quanto fa")){
    try{
      var expr = domanda.replace(/quanto fa/gi,"").replace(/più/gi,"+").replace(/per/gi,"*").replace(/diviso/gi,"/").replace(/meno/gi,"-");
      var val = Function("return (" + expr + ")")();
      risposta = "Fa " + val + ".";
    }catch(e){ risposta = ""; }
  }

  // Se non è un comando, CERCA SU WIKIPEDIA E DILLA SUBITO
  if(!risposta){
    risposta = await cercaSuWikipedia(domanda);
  }
  if(!risposta){
    risposta = await cercaOnlineLibero(domanda);
  }
  if(!risposta){
    risposta = "Non ho trovato " + domanda + " con quel nome. Prova a chiedermelo così: cos'è un PC, chi è Napoleone, cos'è un buco nero. Così lo trovo sicuro su Wikipedia.";
  }

  document.getElementById("stato").textContent = "PRONTO - CHIEDIMI TUTTO";
  parla(risposta);
}

// Invio con tastiera
document.getElementById("domanda").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    var v = e.target.value;
    e.target.value = "";
    rispondi(v);
  }
});

// Microfono
function ascolta(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ parla("Usa Chrome per parlare. Oppure scrivi la domanda."); return; }
  var rec = new SR();
  rec.lang = "it-IT";
  rec.onresult = function(e){ rispondi(e.results[0][0].transcript); };
  rec.onerror = function(){ parla("Non ti ho sentito. Riprova, oppure scrivi."); };
  rec.start();
  document.getElementById("stato").textContent = "TI ASCOLTO... PARLA";
}

// Carica voci italiane
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}
</script>
</body>
</html>
