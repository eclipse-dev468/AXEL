<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#dopo{padding:18px;max-width:760px;margin:0 auto}
h1{font-size:32px;letter-spacing:6px;margin:8px}
#stato{font-size:16px;min-height:22px;color:#888}
#stato.sveglio{color:#00e5ff}
#live{font-size:17px;color:#ffcc00;min-height:24px;background:#1a1a00;border:1px solid #333;border-radius:10px;padding:8px;margin:8px 0}
#log{background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:12px;text-align:left;font-size:14px;min-height:70px;max-height:120px;overflow:auto;color:#aaa}
#risposta{font-size:21px;line-height:1.5;min-height:130px;background:#111;border:1px solid #333;border-radius:16px;padding:18px;text-align:left;white-space:pre-wrap;margin-top:10px}
#domanda{width:100%;padding:14px;border-radius:99px;border:1px solid #00e5ff;background:#111;color:#fff;font-size:18px;box-sizing:border-box}
button{padding:13px 20px;font-size:16px;border-radius:99px;border:0;background:#00e5ff;cursor:pointer;margin:5px;font-weight:700}
button.grigio{background:#333;color:#fff}
#cerchio{width:80px;height:80px;border-radius:50%;margin:10px auto;border:3px solid #00ff9d;display:flex;align-items:center;justify-content:center;font-size:28px}
</style>
</head>
<body>
<div id="dopo">
<h1>AXEL - SERIO</h1>
<div id="cerchio">🎤</div>
<p id="stato">PARTO DA SOLO...</p>
<p style="font-size:13px;color:#00ff9d">✅ Server serio attivo - Nessuna chiave nel browser</p>
<div id="live">Sto per partire...</div>
<div id="log">LOG:<br>• Avvio...</div>
<div id="risposta">Ciao signore. Ora sono serio. Il cervello sta nel server, non nel browser. Dimmi pure qualsiasi cosa.</div>
<br>
<input id="domanda" placeholder="Scrivi qui... e premi Invio">
<br><br>
<button onclick="testCervello()">🧪 PROVA CERVELLO SERIO</button>
<button class="grigio" onclick="sbloccaTutto()">🔓 SBLOCCA VOCE + MICROFONO</button>
</div>
<script>
let streamMicrofono = null;
let staParlando = false;
let inTurno = false;
function log(t){
  var el = document.getElementById("log");
  var ora = new Date().toLocaleTimeString("it-IT");
  el.innerHTML = "LOG:<br>• " + ora + " - " + t + "<br>" + el.innerHTML.split("<br>").slice(0,9).join("<br>");
}
function setStato(testo, classe){
  var s = document.getElementById("stato");
  s.textContent = testo;
  s.className = classe || "";
}
function mutaMicrofono(muta){
  if(!streamMicrofono) return;
  streamMicrofono.getTracks().forEach(function(tr){ tr.enabled = !muta; });
}
function parla(testo){
  return new Promise(function(res){
    document.getElementById("risposta").textContent = testo;
    if(!("speechSynthesis" in window)){ res(); return; }
    try{ window.speechSynthesis.cancel(); }catch(e){}
    staParlando = true;
    mutaMicrofono(true);
    var u = new SpeechSynthesisUtterance(testo);
    u.lang = "it-IT"; u.rate = 0.92; u.volume = 0.9;
    var voci = window.speechSynthesis.getVoices();
    var it = voci.find(v => v.lang === "it-IT") || voci[0];
    if(it) u.voice = it;
    var finito = false;
    function finisci(){
      if(finito) return;
      finito = true;
      staParlando = false;
      mutaMicrofono(false);
      res();
    }
    u.onend = finisci; u.onerror = finisci;
    window.speechSynthesis.speak(u);
    setTimeout(finisci, 15000);
  });
}
async function tieniMicrofonoAperto(){
  try{
    if(streamMicrofono) return true;
    streamMicrofono = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    log("Microfono aperto");
    return true;
  }catch(e){ log("Microfono bloccato: " + e.message); return false; }
}
async function sbloccaTutto(){
  var ok = await tieniMicrofonoAperto();
  if(ok){ await parla("Microfono e voce sbloccati signore. Ora dimmi Axel."); }
}
function ascoltaUnaVolta(secondi){
  return new Promise(function(res){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ log("Browser senza riconoscimento vocale, usa Chrome"); res(""); return; }
    var rec = new SR();
    rec.lang = "it-IT";
    rec.continuous = false;
    rec.interimResults = true;
    var finito = false;
    var timer = setTimeout(function(){ finisci(""); }, (secondi || 10) * 1000);
    function finisci(testo){
      if(finito) return;
      finito = true;
      clearTimeout(timer);
      try{ rec.stop(); }catch(e){}
      res(testo);
    }
    rec.onresult = function(e){
      var finale = "";
      var provvisorio = "";
      for(var i=0;i<e.results.length;i++){
        if(e.results[i].isFinal) finale += e.results[i][0].transcript + " ";
        else provvisorio += e.results[i][0].transcript + " ";
      }
      var mostra = (provvisorio || finale).trim();
      if(mostra) document.getElementById("live").textContent = "STO SENTENDO: " + mostra;
      if(finale.trim()) finisci(finale.trim());
    };
    rec.onerror = function(e){ log("Errore ascolto: " + e.error); finisci(""); };
    rec.onend = function(){ finisci(""); };
    try{ rec.start(); }catch(e){ finisci(""); }
  });
}
async function cicloAxel(){
  if(inTurno) return;
  inTurno = true;
  while(true){
    try{
      setStato('DORMO... DI\' "AXEL"', "");
      document.getElementById("live").textContent = "Dormo... dimmi Axel";
      var sveglia = await ascoltaUnaVolta(12);
      var basso = (sveglia || "").toLowerCase();
      if(!(basso.includes("axel") || basso.includes("accel") || basso.includes("exel") || basso.includes("axl"))) continue;
      log("AXEL rilevato: " + sveglia);
      setStato("SONO SVEGLIO - DIMMI LA DOMANDA", "sveglio");
      await parla("Dimmi signore, ti ascolto.");
      var domanda = await ascoltaUnaVolta(12);
      domanda = (domanda || "").replace(/axel/gi,"").trim();
      if(!domanda){ continue; }
      setStato("STO PENSANDO...", "sveglio");
      var risposta = await pensa(domanda);
      await parla(risposta);
      setStato("ANCORA SVEGLIO - UN'ALTRA SENZA DIRE AXEL", "sveglio");
      var domanda2 = await ascoltaUnaVolta(12);
      domanda2 = (domanda2 || "").replace(/axel/gi,"").trim();
      if(domanda2){
        var risposta2 = await pensa(domanda2);
        await parla(risposta2);
      }
    }catch(e){
      log("Errore ciclo: " + e.message);
      await new Promise(function(r){ setTimeout(r, 1000); });
    }
  }
}
async function testCervello(){
  log("TEST: mando domanda al server...");
  var r = await pensa("cos'è un computer? Spiegamelo in modo semplice.");
  parla(r);
}
// ORA CHIAMA IL SERVER, NON GROQ DIRETTAMENTE - QUI ERA IL PROBLEMA
async function pensa(domanda){
  try{
    log("Mando al server: " + domanda);
    var r = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ domanda: domanda })
    });
    var d = await r.json();
    log("Server ha risposto");
    return d.risposta || "Signore, il server non ha risposto.";
  }catch(e){
    log("Errore server: " + e.message);
    return "Signore, il server non risponde. Controlla che la finestra nera sia aperta con npm start.";
  }
}
window.addEventListener("load", async function(){
  log("Avvio serio...");
  var ok = await tieniMicrofonoAperto();
  if(ok){
    await parla("Ciao signore. Ora sono serio. Il cervello sta nel server.");
    cicloAxel();
  } else {
    log("Premi SBLOCCA VOCE + MICROFONO");
  }
});
document.getElementById("domanda").addEventListener("keydown", async function(e){
  if(e.key === "Enter"){
    var v = e.target.value;
    e.target.value = "";
    var r = await pensa(v);
    parla(r);
  }
});
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}
</script>
</body>
</html>
