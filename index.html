<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL</title>
<style>
body{margin:0;background:#000;color:white;font-family:system-ui,sans-serif;text-align:center}
#gate{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer}
#gate b{font-size:60px;letter-spacing:10px}
#gate span{margin-top:15px;color:#00e5ff}
#dopo{display:none;padding-top:120px}
#dopo h1{font-size:40px}
button{padding:15px 25px;font-size:18px;border-radius:30px;border:0;background:#00e5ff;cursor:pointer;margin:10px}
#risposta{font-size:22px;margin:30px;padding:20px}
</style>
</head>
<body>

<div id="gate" onclick="parti()">
<b>AXEL</b>
<span>CLICCA QUI PER INIZIALIZZARE</span>
<p style="opacity:.6">Se clicchi e non succede niente, il file è vecchio. Premi Ctrl + Shift + R</p>
</div>

<div id="dopo">
<h1>AXEL È PARTITO!</h1>
<p>Ora funziona. Dimmi pure.</p>
<button onclick="parla()">PROVA VOCE</button>
<button onclick="scrivi()">SCRIVI DOMANDA</button>
<p id="risposta">Ciao, sono Axel. Ora parto sempre.</p>
<input id="domanda" placeholder="Scrivi qui: cos'è un PC?" style="padding:12px;width:80%;max-width:400px;border-radius:20px;border:1px solid #00e5ff;background:#111;color:white;display:none">
</div>

<script>
function parti(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("dopo").style.display = "block";
  parla();
}
function parla(){
  var testo = document.getElementById("risposta").textContent;
  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(testo);
    u.lang = "it-IT";
    window.speechSynthesis.speak(u);
  }
}
function scrivi(){
  var inp = document.getElementById("domanda");
  inp.style.display = "block";
  inp.focus();
}
document.getElementById("domanda").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    var q = e.target.value.toLowerCase();
    var r = "";
    if(q.includes("pc") || q.includes("computer")){
      r = "Un PC è un Personal Computer. È un computer che usi tu da solo, per studiare, giocare e andare su internet. Ha schermo, tastiera, mouse, processore, memoria RAM e disco.";
    } else if(q.includes("buco nero")){
      r = "Un buco nero è una zona dello spazio dove la gravità è così forte che nemmeno la luce riesce a scappare. Si forma quando una stella molto grande muore e collassa su se stessa.";
    } else if(q.includes("ciao")){
      r = "Ciao! Sono Axel, finalmente parto. Chiedimi quello che vuoi.";
    } else {
      r = "Bella domanda: " + e.target.value + ". Ora ti rispondo con 【entity-Wikipedia¦canonical_name=Wikipedia】 nella versione completa. Per ora dimmi: vuoi sapere cos'è, chi è, o come funziona?";
    }
    document.getElementById("risposta").textContent = r;
    parla();
    e.target.value = "";
  }
});
</script>
</body>
</html>
