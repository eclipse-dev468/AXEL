<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXEL</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;text-align:center}
#dopo{padding:18px;max-width:760px;margin:0 auto}
h1{font-size:32px;letter-spacing:6px;margin:8px}
#stato{font-size:16px;min-height:22px;color:#888}
#stato.sveglio{color:#00e5ff}
#stato.bloccato{color:#ff5555}
#live{font-size:17px;color:#ffcc00;min-height:24px;background:#1a1a00;border:1px solid #333;border-radius:10px;padding:8px;margin:8px 0}
#log{background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:12px;text-align:left;font-size:14px;min-height:70px;max-height:120px;overflow:auto;color:#aaa}
#risposta{font-size:21px;line-height:1.5;min-height:130px;background:#111;border:1px solid #333;border-radius:16px;padding:18px;text-align:left;white-space:pre-wrap;margin-top:10px}
#domanda{width:100%;padding:14px;border-radius:99px;border:1px solid #00e5ff;background:#111;color:#fff;font-size:18px;box-sizing:border-box}
button{padding:12px 18px;font-size:15px;border-radius:99px;border:0;background:#00e5ff;cursor:pointer;margin:5px;font-weight:700}
button.grigio{background:#333;color:#fff}
button.rosso{background:#ff4444;color:#fff}
#cerchio{width:80px;height:80px;border-radius:50%;margin:10px auto;border:3px solid #00ff9d;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 15px #00ff9d}
#cerchio.sveglio{border-color:#00e5ff;box-shadow:0 0 25px #00e5ff}
</style>
</head>
<body>

<div id="dopo">
<h1>AXEL - SEMPRE IN ASCOLTO</h1>
<div id="cerchio">🎤</div>
<p id="stato">PARTO DA SOLO...</p>
<div id="live">Sto per partire...</div>
<div id="log">LOG:<br>• Avvio...</div>
<div id="risposta">Ciao signore. Ora non mi blocco più. Dopo ogni risposta torno subito ad ascoltarti.</div>
<br>
<input id="domanda" placeholder="Se la voce non va, scrivi qui... e premi Invio">
<br><br>
<button onclick="sbloccaTutto()">🔄 SBLOCCA - FAMMI FARE UN'ALTRA DOMANDA</button>
<br>
<button class="grigio" onclick="sbloccaMicrofono()">🔓 SBLOCCA MICROFONO</button>
<button class="grigio" onclick="fermaTutto()">⏹ FERMA VOCE</button>
</div>

<script>
let rec = null;
let modalita = "dorme"; // dorme, sveglio, rispondo
let staParlando = false;
let streamMicrofono = null;
let staAscoltando = false;
let ultimoAscolto = Date.now();
let domandaInCorso = false;

function log(t){
  var el = document.getElementById("log");
  var ora = new Date().toLocaleTimeString("it-IT");
  el.innerHTML = "LOG:<br>• " + ora + " - " + t + "<br>" + el.innerHTML.split("<br>").slice(0,8).join("<br>");
}
function setStato(testo, classe){
  var s = document.getElementById("stato");
  s.textContent = testo;
  s.className = classe || "";
  var c = document.getElementById("cerchio");
  c.className = classe === "sveglio" ? "sveglio" : "";
  c.textContent = classe === "sveglio" ? "👂" : "🎤";
}

// SBLOCCA TUTTO - se si blocca, premi questo e riparte
function sbloccaTutto(){
  log("SBLOCCO FORZATO - riparto da zero");
  modalita = "dorme";
  domandaInCorso = false;
  staParlando = false;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  try{ if(rec) rec.stop(); }catch(e){}
  staAscoltando = false;
  setStato('SBLOCCATO - DI\' "AXEL"', "dorme");
  document.getElementById("risposta").textContent = "Ok signore, mi sono sbloccato. Ora dimmi di nuovo Axel e fammi un'altra domanda.";
  parla("Mi sono sbloccato signore. Dimmi di nuovo Axel.");
  setTimeout(avviaAscolto, 600);
}
function fermaTutto(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  staParlando = false;
  log("Voce fermata");
}

function parla(testo){
  return new Promise(function(res){
    document.getElementById("risposta").textContent = testo;
    if(!("speechSynthesis" in window)){ res(); return; }
    try{ window.speechSynthesis.cancel(); }catch(e){}
    staParlando = true;
    try{ if(rec) rec.stop(); }catch(e){}
    staAscoltando = false;
    var u = new SpeechSynthesisUtterance(testo);
    u.lang = "it-IT"; u.rate = 0.95;
    var voci = window.speechSynthesis.getVoices();
    var it = voci.find(v => v.lang === "it-IT") || voci[0];
    if(it) u.voice = it;
    var finito = false;
    function finisci(){
      if(finito) return;
      finito = true;
      staParlando = false;
      // DOPO AVER PARLATO, TORNA SEMPRE A DORMIRE E RIASCOLTA - QUESTO PRIMA MANCAVA
      modalita = "dorme";
      domandaInCorso = false;
      setStato('DORMO... DI\' "AXEL" PER UN\'ALTRA DOMANDA', "dorme");
      log("Ho finito di parlare, torno ad ascoltare");
      setTimeout(avviaAscolto, 500);
      res();
    }
    u.onend = finisci;
    u.onerror = finisci;
    window.speechSynthesis.speak(u);
    // Se la voce si blocca per più di 15 secondi, sblocco da solo
    setTimeout(finisci, 15000);
  });
}

async function tieniMicrofonoAperto(){
  try{
    if(streamMicrofono) return true;
    streamMicrofono = await navigator.mediaDevices.getUserMedia({audio:true});
    log("Microfono aperto fisso");
    return true;
  }catch(e){
    log("Microfono BLOCCATO - clicca lucchetto in alto e Consenti");
    document.getElementById("live").textContent = "Microfono bloccato. Clicca il lucchetto in alto e metti Consenti, poi ricarica.";
    return false;
  }
}

function avviaAscolto(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ log("Usa Chrome."); return; }
  if(staParlando) return;
  if(staAscoltando) return;
  try{
    rec = new SR();
    rec.lang = "it-IT";
    rec.continuous = true;
    rec.interimResults = true;
    staAscoltando = true;
    ultimoAscolto = Date.now();

    rec.onresult = function(e){
      ultimoAscolto = Date.now();
      if(staParlando) return;
      var finale = "";
      var provvisorio = "";
      for(var i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) finale += e.results[i][0].transcript + " ";
        else provvisorio += e.results[i][0].transcript + " ";
      }
      var daMostrare = (provvisorio || finale).trim();
      if(daMostrare) document.getElementById("live").textContent = "STO SENTENDO: " + daMostrare;
      if(finale.trim()){
        log("Ho sentito: " + finale.trim());
        // Se sta già rispondendo a una domanda, ignora il resto, così non si incastra
        if(domandaInCorso) { log("Sto già rispondendo, ignoro"); return; }
        gestisciVoce(finale.trim());
      }
    };
    rec.onerror = function(e){
      log("Errore mic: " + e.error);
      staAscoltando = false;
      if(e.error === "not-allowed"){
        setStato("MICROFONO BLOCCATO", "bloccato");
      }
    };
    rec.onend = function(){
      staAscoltando = false;
      if(!staParlando){
        setTimeout(avviaAscolto, 400);
      }
    };
    rec.onstart = function(){ log("Ascolto attivo"); };
    rec.start();
  }catch(e){
    staAscoltando = false;
    setTimeout(avviaAscolto, 800);
  }
}

// CONTROLLO OGNI 3 SECONDI: se si è spento, lo riaccendo - QUESTO PRIMA NON C'ERA
setInterval(function(){
  if(staParlando) return;
  if(!staAscoltando){
    log("Controllo: era spento, lo riaccendo...");
    avviaAscolto();
  }
  // Se è in "rispondo" da più di 20 secondi, è bloccato, sblocco da solo
  if(modalita === "rispondo" && Date.now() - ultimoAscolto > 20000 && !domandaInCorso){
    log("Era bloccato in rispondo da troppo, sblocco da solo");
    sbloccaTutto();
  }
}, 3000);

async function gestisciVoce(testo){
  var basso = testo.toLowerCase();
  var haDettoAxel = basso.includes("axel") || basso.includes("accel") || basso.includes("exel") || basso.includes("axl");
  if(modalita === "dorme"){
    if(haDettoAxel){
      log("!!! AXEL RILEVATO !!!");
      modalita = "sveglio";
      setStato("SONO SVEGLIO - DIMMI LA DOMANDA", "sveglio");
      await parla("Dimmi signore, ti ascolto.");
      setStato("TI ASCOLTO - FAMMI LA DOMANDA", "sveglio");
      // Se dopo 10 secondi non fai la domanda, torno a dormire da solo
      setTimeout(function(){
        if(modalita === "sveglio" && !domandaInCorso){
          modalita = "dorme";
          setStato('DORMO... DI\' "AXEL"', "dorme");
          log("Nessuna domanda, torno a dormire");
        }
      }, 10000);
    }
    return;
  }
  if(modalita === "sveglio"){
    if(basso.includes("dormi") || basso.includes("basta")){
      modalita = "dorme";
      setStato('DORMO... DI\' "AXEL"', "dorme");
      await parla("Va bene signore, torno a dormire.");
      return;
    }
    // BLOCCO LA DOPPIA DOMANDA MENTRE RISPONDO
    domandaInCorso = true;
    modalita = "rispondo";
    setStato("STO PENSANDO...", "sveglio");
    log("Domanda ricevuta, mando al cervello...");
    try{
      var risposta = await pensa(testo);
      await parla(risposta);
    }catch(e){
      log("Errore risposta: " + e.message);
      await parla("Scusa signore, mi ero bloccato. Dimmi di nuovo Axel e rifammi la domanda.");
    }
    // parla() ha già rimesso modalita = dorme, ma per sicurezza:
    domandaInCorso = false;
    modalita = "dorme";
  }
}

async function sbloccaMicrofono(){
  var ok = await tieniMicrofonoAperto();
  if(ok){ parla("Microfono sbloccato signore. Ora dì solo Axel."); avviaAscolto(); }
}

window.addEventListener("load", async function(){
  log("Pagina aperta, parto da solo...");
  var ok = await tieniMicrofonoAperto();
  if(ok){
    modalita = "dorme";
    setStato('DORMO... DI\' "AXEL" PER SVEGLIARMI', "dorme");
    await parla("Ciao signore. Sono partito da solo. Ora non mi blocco più. Dì solo Axel.");
    avviaAscolto();
  }
});

async function cervello1(domanda){
  try{
    var r = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "openai",
        messages: [
          {role: "system", content: "Sei AXEL, assistente italiano come Jarvis. Sai tutto. Rispondi in italiano, semplice, max 6 frasi. Non dire mai non so. Chiamalo solo signore."},
          {role: "user", content: domanda}
        ],
        temperature: 0.7
      })
    });
    if(!r.ok) return null;
    var d = await r.json();
    var t = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
    if(t && t.trim().length > 5) return t.trim();
  }catch(e){ return null; }
  return null;
}
async function cervello2(domanda){
  try{
    var r = await fetch("https://text.pollinations.ai/" + encodeURIComponent("Sei AXEL, assistente italiano, sai tutto. Rispondi in italiano, 5 frasi, chiamalo solo signore. Domanda: " + domanda));
    if(!r.ok) return null;
    var t = await r.text();
    if(t && t.length > 20) return t.slice(0,1500);
  }catch(e){ return null; }
  return null;
}
async function pensa(domanda){
  var q = domanda.toLowerCase();
  if(q.includes("che ore")) return "Sono le " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) + ", signore.";
  if(q.includes("che giorno")) return "Oggi è " + new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + ", signore.";
  // Timeout di 12 secondi: se il cervello non risponde, non resto bloccato
  var timeout = new Promise(function(res){ setTimeout(function(){ res(null); }, 12000); });
  var r = await Promise.race([cervello1(domanda), timeout]);
  if(!r) r = await cervello2(domanda);
  if(!r) r = "Signore, il cervello era occupato. Dimmi di nuovo Axel e rifammi la domanda, ora sono libero.";
  return r;
}
document.getElementById("domanda").addEventListener("keydown", async function(e){
  if(e.key === "Enter"){
    var v = e.target.value;
    e.target.value = "";
    if(domandaInCorso){
      log("Sto già rispondendo, aspetto...");
      return;
    }
    log("Hai scritto: " + v);
    domandaInCorso = true;
    var r = await pensa(v);
    domandaInCorso = false;
    parla(r);
  }
});
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
